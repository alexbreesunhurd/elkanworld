<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELKAN — Your World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;1,300&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a0a0a;
    --white: #f0ede6;
    --cream: #e8e4da;
    --dim: #1a1a1a;
    --mid: #2a2a2a;
    --muted: #888;
    --accent: #c8b89a;
    --hot: #e85d24;
    --sport: #1a6bb5;
    --art: #7c4d8a;
    --fashion: #b5955a;
    --gaming: #1a9e6b;
    --music: #c8392b;
    --font-display: 'Bebas Neue', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --font-body: 'DM Sans', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    font-weight: 300;
    overflow-x: hidden;
    cursor: default;
  }

  /* ── GRAIN OVERLAY ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.35;
  }

  /* ── ONBOARDING SCREEN ── */
  #onboarding {
    position: fixed;
    inset: 0;
    background: var(--black);
    z-index: 900;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  #onboarding.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  .ob-logo {
    font-family: var(--font-display);
    font-size: clamp(64px, 15vw, 140px);
    letter-spacing: 0.05em;
    color: var(--white);
    line-height: 1;
    margin-bottom: 0.5rem;
    opacity: 0;
    animation: fadeUp 0.8s 0.2s forwards;
  }
  .ob-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 3rem;
    opacity: 0;
    animation: fadeUp 0.8s 0.5s forwards;
  }
  .ob-question {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.08em;
    margin-bottom: 1.25rem;
    text-align: center;
    opacity: 0;
    animation: fadeUp 0.8s 0.8s forwards;
  }
  .ob-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    max-width: 700px;
    width: 100%;
    opacity: 0;
    animation: fadeUp 0.8s 1s forwards;
  }
  @media (max-width: 600px) { .ob-grid { grid-template-columns: repeat(3, 1fr); } }

  .ob-btn {
    padding: 14px 8px;
    border: 0.5px solid #333;
    background: transparent;
    color: var(--white);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    line-height: 1.4;
  }
  .ob-btn:hover { border-color: var(--accent); color: var(--accent); }
  .ob-btn.selected { border-color: var(--white); color: var(--white); background: #1a1a1a; }
  .ob-btn .ob-icon { font-size: 20px; display: block; margin-bottom: 6px; }

  .ob-enter {
    margin-top: 2rem;
    padding: 14px 48px;
    background: var(--white);
    color: var(--black);
    font-family: var(--font-display);
    font-size: 18px;
    letter-spacing: 0.1em;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    opacity: 0;
    animation: fadeUp 0.8s 1.2s forwards;
    display: none;
  }
  .ob-enter.visible { display: block; }
  .ob-enter:hover { background: var(--accent); }

  /* ── MAIN WORLD ── */
  #world {
    opacity: 0;
    transition: opacity 1s ease;
    min-height: 100vh;
  }
  #world.visible { opacity: 1; }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 2rem;
    border-bottom: 0.5px solid #1e1e1e;
    background: rgba(10,10,10,0.85);
    backdrop-filter: blur(12px);
  }
  .nav-logo {
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: 0.1em;
    color: var(--white);
  }
  .nav-cohort {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cohort-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--cohort-color, var(--accent));
    display: inline-block;
  }
  .nav-right {
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }
  .nav-wa {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    color: #25D366;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .wa-dot { width: 5px; height: 5px; border-radius: 50%; background: #25D366; animation: pulse 2s infinite; }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 6rem 2rem 4rem;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 60%, var(--cohort-bg, #1a1205) 0%, var(--black) 65%);
    transition: background 1s ease;
  }

  .hero-date {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 2rem;
    position: relative;
  }

  .hero-title {
    font-family: var(--font-display);
    font-size: clamp(80px, 18vw, 200px);
    line-height: 0.9;
    text-align: center;
    letter-spacing: 0.02em;
    position: relative;
    background: linear-gradient(180deg, var(--white) 40%, rgba(240,237,230,0.3) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-divider {
    width: 0.5px;
    height: 60px;
    background: linear-gradient(to bottom, var(--accent), transparent);
    margin: 2.5rem auto;
    position: relative;
  }

  .hero-drop {
    position: relative;
    text-align: center;
    max-width: 420px;
  }
  .hero-drop-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--hot);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }
  .hero-drop-text {
    font-size: 14px;
    color: var(--accent);
    line-height: 1.7;
    font-weight: 300;
  }

  .hero-timer {
    margin-top: 2rem;
    font-family: var(--font-display);
    font-size: 32px;
    letter-spacing: 0.15em;
    color: var(--hot);
  }
  .hero-timer-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 4px;
    text-align: center;
  }

  /* ── SCROLL INDICATOR ── */
  .scroll-hint {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--muted);
    text-transform: uppercase;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    animation: breathe 3s ease-in-out infinite;
  }
  .scroll-line {
    width: 0.5px;
    height: 40px;
    background: linear-gradient(to bottom, var(--muted), transparent);
  }

  /* ── SECTION ── */
  section {
    padding: 5rem 2rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  .section-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 2.5rem;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 0.5px;
    background: #1e1e1e;
  }

  /* ── ROOM GRID ── */
  .rooms {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: #1a1a1a;
    border: 1px solid #1a1a1a;
  }
  @media (max-width: 768px) { .rooms { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 480px) { .rooms { grid-template-columns: 1fr; } }

  .room {
    background: var(--black);
    padding: 1.75rem;
    cursor: pointer;
    transition: background 0.2s;
    position: relative;
    overflow: hidden;
  }
  .room:hover { background: var(--dim); }
  .room.locked { opacity: 0.38; cursor: not-allowed; }
  .room.locked:hover { background: var(--black); }
  .room.featured {
    grid-column: span 2;
    background: var(--dim);
  }
  @media (max-width: 480px) { .room.featured { grid-column: span 1; } }

  .room-number {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.2em;
    color: #444;
    margin-bottom: 1.25rem;
  }
  .room-name {
    font-family: var(--font-display);
    font-size: 26px;
    letter-spacing: 0.04em;
    color: var(--white);
    line-height: 1.1;
    margin-bottom: 0.75rem;
  }
  .room.featured .room-name { font-size: 36px; }
  .room-desc {
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
    font-weight: 300;
  }
  .room-tags {
    display: flex;
    gap: 6px;
    margin-top: 1.25rem;
    flex-wrap: wrap;
  }
  .room-tag {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.15em;
    padding: 3px 8px;
    border: 0.5px solid #2a2a2a;
    color: #555;
    text-transform: uppercase;
  }
  .room-new {
    position: absolute;
    top: 1.75rem; right: 1.75rem;
    font-family: var(--font-mono);
    font-size: 8px;
    letter-spacing: 0.2em;
    padding: 2px 8px;
    background: var(--hot);
    color: var(--white);
    text-transform: uppercase;
  }
  .room-lock {
    position: absolute;
    bottom: 1.75rem; right: 1.75rem;
    font-size: 14px;
    color: #333;
  }

  /* ── LATEST DROP ── */
  .drop-strip {
    border: 0.5px solid #1e1e1e;
    padding: 2rem;
    display: flex;
    align-items: flex-start;
    gap: 2rem;
    transition: border-color 0.2s;
    cursor: pointer;
    margin-bottom: 1px;
  }
  .drop-strip:hover { border-color: #333; }
  .drop-num {
    font-family: var(--font-display);
    font-size: 48px;
    color: #1e1e1e;
    line-height: 1;
    flex-shrink: 0;
    width: 48px;
  }
  .drop-content { flex: 1; }
  .drop-type {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }
  .drop-title {
    font-family: var(--font-body);
    font-size: 16px;
    font-weight: 400;
    color: var(--white);
    margin-bottom: 0.35rem;
  }
  .drop-meta {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .drop-exclusive {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--hot);
    text-transform: uppercase;
    text-align: right;
    flex-shrink: 0;
    align-self: center;
  }

  /* ── PROGRESS BAR ── */
  .album-progress {
    border: 0.5px solid #1e1e1e;
    padding: 2rem;
    margin-top: 4rem;
  }
  .progress-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 1.75rem;
  }
  .progress-title {
    font-family: var(--font-display);
    font-size: 20px;
    letter-spacing: 0.06em;
  }
  .progress-note {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }
  .progress-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .progress-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    width: 140px;
    flex-shrink: 0;
  }
  .progress-track {
    flex: 1;
    height: 1px;
    background: #1e1e1e;
    position: relative;
  }
  .progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: var(--cohort-color, var(--accent));
    transition: width 1.5s cubic-bezier(0.4,0,0.2,1);
  }
  .progress-pct {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    width: 32px;
    text-align: right;
    flex-shrink: 0;
  }

  /* ── FOOTER ── */
  footer {
    border-top: 0.5px solid #1a1a1a;
    padding: 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .footer-logo { font-family: var(--font-display); font-size: 16px; letter-spacing: 0.1em; color: #2a2a2a; }
  .footer-note { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.15em; color: #2a2a2a; text-transform: uppercase; }

  /* ── MODAL ── */
  #modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s;
    backdrop-filter: blur(4px);
  }
  #modal-overlay.open { opacity: 1; visibility: visible; }

  .modal {
    background: var(--dim);
    border: 0.5px solid #2a2a2a;
    max-width: 560px;
    width: 100%;
    padding: 2.5rem;
    position: relative;
  }
  .modal-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }
  .modal-title {
    font-family: var(--font-display);
    font-size: 36px;
    letter-spacing: 0.04em;
    margin-bottom: 1rem;
    line-height: 1;
  }
  .modal-body {
    font-size: 13px;
    color: #999;
    line-height: 1.8;
    margin-bottom: 1.5rem;
    font-weight: 300;
  }
  .modal-exclusive {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--hot);
    text-transform: uppercase;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .modal-exclusive::before { content: '●'; font-size: 6px; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-btn {
    padding: 10px 24px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border: 0.5px solid #333;
    background: transparent;
    color: var(--white);
    cursor: pointer;
    transition: all 0.2s;
  }
  .modal-btn:hover { border-color: var(--accent); color: var(--accent); }
  .modal-btn.primary { background: var(--white); color: var(--black); border-color: var(--white); }
  .modal-btn.primary:hover { background: var(--accent); border-color: var(--accent); }
  .modal-close {
    position: absolute;
    top: 1.5rem; right: 1.5rem;
    font-family: var(--font-mono);
    font-size: 10px;
    color: #444;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: color 0.2s;
  }
  .modal-close:hover { color: var(--white); }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
    50% { opacity: 0.8; transform: translateX(-50%) translateY(-6px); }
  }
  @keyframes countdown {
    0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; }
  }
  .hero-timer { animation: countdown 2s ease-in-out infinite; }

  /* Stagger reveal on world load */
  .reveal {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .reveal.in { opacity: 1; transform: none; }
</style>
</head>
<body>

<!-- ONBOARDING -->
<div id="onboarding">
  <div class="ob-logo">ELKAN</div>
  <div class="ob-sub">Private World Access</div>
  <div class="ob-question">— What's your world? —</div>
  <div class="ob-grid">
    <button class="ob-btn" data-cohort="sport" data-color="#1a6bb5" data-bg="#050e1a" onclick="selectCohort(this)">
      <span class="ob-icon">⚡</span>Sport
    </button>
    <button class="ob-btn" data-cohort="art" data-color="#7c4d8a" data-bg="#0d080f" onclick="selectCohort(this)">
      <span class="ob-icon">◎</span>Art
    </button>
    <button class="ob-btn" data-cohort="fashion" data-color="#b5955a" data-bg="#120f07" onclick="selectCohort(this)">
      <span class="ob-icon">◈</span>Fashion
    </button>
    <button class="ob-btn" data-cohort="gaming" data-color="#1a9e6b" data-bg="#051209" onclick="selectCohort(this)">
      <span class="ob-icon">▣</span>Gaming
    </button>
    <button class="ob-btn" data-cohort="music" data-color="#c8392b" data-bg="#120505" onclick="selectCohort(this)">
      <span class="ob-icon">♦</span>Music
    </button>
  </div>
  <button class="ob-enter" id="enter-btn" onclick="enterWorld()">Enter the world</button>
</div>

<!-- MAIN WORLD -->
<div id="world">

  <!-- NAV -->
  <nav>
    <div class="nav-logo">ELKAN</div>
    <div class="nav-cohort">
      <span class="cohort-dot" id="nav-dot"></span>
      <span id="nav-cohort-name">— door</span>
    </div>
    <div class="nav-right">
      <div class="nav-wa">
        <span class="wa-dot"></span>
        Community active
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-date" id="hero-date"></div>
    <div class="hero-title">ELKAN</div>
    <div class="hero-divider"></div>
    <div class="hero-drop">
      <div class="hero-drop-label" id="drop-label">Latest drop — your world</div>
      <div class="hero-drop-text" id="drop-text">Loading your world...</div>
      <div class="hero-timer" id="hero-timer">46:22:09</div>
      <div class="hero-timer-label">Until public release</div>
    </div>
    <div class="scroll-hint">
      <span>Scroll</span>
      <div class="scroll-line"></div>
    </div>
  </div>

  <!-- ROOMS -->
  <section>
    <div class="section-label">Your rooms</div>
    <div class="rooms" id="rooms-grid"></div>
  </section>

  <!-- LATEST DROPS -->
  <section style="padding-top: 0;">
    <div class="section-label">Latest drops</div>
    <div id="drops-list"></div>

    <!-- ALBUM PROGRESS -->
    <div class="album-progress">
      <div class="progress-header">
        <div class="progress-title">Album in progress</div>
        <div class="progress-note">You're watching this happen</div>
      </div>
      <div id="progress-items"></div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="footer-logo">ELKAN</div>
    <div class="footer-note">Private world — do not share this link</div>
  </footer>

</div>

<!-- MODAL -->
<div id="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-close" id="modal-close-btn">✕ close</div>
    <div class="modal-label" id="modal-label"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-exclusive" id="modal-exclusive"></div>

let currentCohort = null;

function selectCohort(btn) {
  document.querySelectorAll('.ob-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  currentCohort = btn.dataset.cohort;
  document.getElementById('enter-btn').classList.add('visible');
}

function enterWorld() {
  if (!currentCohort) return;
  document.getElementById('onboarding').classList.add('hidden');
  setTimeout(() => buildWorld(currentCohort), 400);
}

function buildWorld(cohort) {
  const c = COHORTS[cohort];
  document.documentElement.style.setProperty('--cohort-color', c.color);
  document.documentElement.style.setProperty('--cohort-bg', c.bg);
  document.getElementById('nav-dot').style.background = c.color;
  document.getElementById('nav-cohort-name').textContent = c.label + ' door';
  document.getElementById('hero-bg').style.background =
    'radial-gradient(ellipse at 50% 60%, ' + c.bg + ' 0%, var(--black) 65%)';
  document.getElementById('hero-date').textContent =
    new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' }).toUpperCase();
  document.getElementById('drop-label').textContent = c.dropLabel;
  document.getElementById('drop-text').textContent = c.heroText;

  // Rooms
  const grid = document.getElementById('rooms-grid');
  grid.innerHTML = c.rooms.map(function(r, i) {
    return '<div class="room reveal ' + (r.featured ? 'featured' : '') + ' ' + (r.locked ? 'locked' : '') + '"' +
      ' data-cohort="' + cohort + '" data-idx="' + i + '" data-locked="' + r.locked + '">' +
      (r.isNew ? '<div class="room-new">New</div>' : '') +
      (r.locked ? '<div class="room-lock">\u2298</div>' : '') +
      '<div class="room-number">' + String(i+1).padStart(2,'0') + '</div>' +
      '<div class="room-name">' + r.name + '</div>' +
      '<div class="room-desc">' + r.desc + '</div>' +
      '<div class="room-tags">' + r.tags.map(function(t){ return '<div class="room-tag">' + t + '</div>'; }).join('') + '</div>' +
      '</div>';
  }).join('');

  grid.onclick = function(e) {
    var room = e.target.closest('.room');
    if (!room || room.dataset.locked === 'true') return;
    openRoom(room.dataset.cohort, parseInt(room.dataset.idx, 10));
  };

  // Drops
  const dropsList = document.getElementById('drops-list');
  dropsList.innerHTML = c.drops.map(function(d, i) {
    return '<div class="drop-strip reveal">' +
      '<div class="drop-num">' + String(i+1).padStart(2,'0') + '</div>' +
      '<div class="drop-content">' +
        '<div class="drop-type">' + d.type + '</div>' +
        '<div class="drop-title">' + d.title + '</div>' +
        '<div class="drop-meta">' + d.meta + '</div>' +
      '</div>' +
      (d.exclusive ? '<div class="drop-exclusive">\u25C6 ' + d.exclusive + '</div>' : '') +
      '</div>';
  }).join('');

  // Progress
  const progItems = document.getElementById('progress-items');
  progItems.innerHTML = c.progress.map(function(p) {
    return '<div class="progress-item reveal">' +
      '<div class="progress-label">' + p.label + '</div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:0%" data-pct="' + p.pct + '"></div></div>' +
      '<div class="progress-pct">' + p.pct + '%</div>' +
      '</div>';
  }).join('');

  document.getElementById('world').classList.add('visible');

  setTimeout(function() {
    document.querySelectorAll('.reveal').forEach(function(el, i) {
      setTimeout(function() { el.classList.add('in'); }, i * 60);
    });
    document.querySelectorAll('.progress-fill').forEach(function(el) {
      el.style.width = el.dataset.pct + '%';
    });
  }, 200);

  startTimer();
}

var timerStarted = false;
function startTimer() {
  if (timerStarted) return;
  timerStarted = true;
  var h = 46, m = 22, s = 9;
  var el = document.getElementById('hero-timer');
  setInterval(function() {
    s--;
    if (s < 0) { s = 59; m--; }
    if (m < 0) { m = 59; h--; }
    if (h < 0) { h = 0; m = 0; s = 0; }
    el.textContent = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }, 1000);
}

function openRoom(cohort, idx) {
  var room = COHORTS[cohort].rooms[idx];
  var c = COHORTS[cohort];
  document.getElementById('modal-label').textContent = c.label + ' door — ' + (room.isNew ? 'NEW' : 'open');
  document.getElementById('modal-title').textContent = room.name;
  var excl = document.getElementById('modal-exclusive');
  if (room.isNew) {
    excl.textContent = '48hr exclusive — public in 46 hours';
    excl.style.display = 'flex';
  } else {
    excl.textContent = '';
    excl.style.display = 'none';
  }
  document.getElementById('modal-body').textContent = room.content;
  document.getElementById('modal-overlay').classList.add('open');
}

document.addEventListener('DOMContentLoaded', function() {
  var overlay = document.getElementById('modal-overlay');
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.classList.remove('open');
  });
  document.getElementById('modal-close-btn').addEventListener('click', function() {
    overlay.classList.remove('open');
  });
  document.getElementById('modal-enter-btn').addEventListener('click', function() {
    overlay.classList.remove('open');
  });
  document.getElementById('modal-share-btn').addEventListener('click', function() {
    overlay.classList.remove('open');
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') overlay.classList.remove('open');
  });
});
